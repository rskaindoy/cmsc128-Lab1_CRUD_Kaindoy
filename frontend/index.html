<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USAD</title>

    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="USAD logo">

        <p>One step at a time.</p>
        <p>Matatapos din yan. Uusad ka rin</p>
        <!-- TODO: Add navigation / user info later -->
    </header>

    <main>

        <section id="task-section">
            
            <div id="task-header">
                <h2>My Tasks</h2>
                <button id="add-task-button" type="button">+ Add Task</button>
            </div>

            <div id="task-controls">
                <!-- FILTERS -->
                <div id="filter-controls">
                    <span class="controls-label">Filter by:</span>

                    <label for="status-filter">Status:</label>
                    <select id="status-filter">
                        <option value="all">ALL</option>
                        <option value="active">Active</option>
                        <option value="done">Completed</option>
                    </select>
                    
                    <label for="category-filter">Category:</label>
                    <select id="category-filter">
                        <option value="all">ALL</option>
                        <option value="School">School</option>
                        <option value="Personal">Personal</option>
                        <option value="Others">Others</option>
                    </select>

                    <label for="priority-filter">Priority:</label>
                    <select id="priority-filter">
                        <option value="all">ALL</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>    
                </div>

                <!-- SORTING -->
                <div id="sort-control">
                    <span class="controls-label">Sort by:</span>
                    <select id="sort-select">
                        <option value="created_at">Date Added</option>
                        <option value="due">Due Date</option>
                        <option value="priority">Priority</option>
                        <option value="tag">Tag</option>
                    </select>
                </div>
            </div>


            <div id="task-list">
                <!-- JS will generate the tasks here -->
            </div>

        </section>
        
        <aside id="add-task-panel">
            <h2 id="task-panel-title">Add a Task</h2>

            <button id="close-task-panel" type="button">X</button>
            
            <form id="task-form">
                <!-- form fields -->
                <div>
                    <label for="title">Task</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="What do you need to do?"
                        required
                    >   
                </div>

                <div>
                    <label for="due">Due date and time</label>
                    <input
                        type="datetime-local"
                        id="due"
                        name="due"
                    >   
                </div>

                <div>
                    <label for="prio">Priority</label>
                    <select id="prio" name="prio">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select> 
                </div>

                <div>
                    <label for="tag">Category</label>
                    <select id="tag" name="tag">
                        <option value="School">School</option>
                        <option value="Personal">Personal</option>
                        <option value="Others">Others</option>
                    </select> 
                </div>

                <button id="task-submit-button" type="submit">Add Task</button>
            </form>
        </aside>
    </main>

    <!-- delete confirmation notif -->
    <div id="delete-confirmation" class="notification">
        <p id="delete-message"></p>

        <div class="confirmation-actions">
            <button id="cancel-delete-button" type="button">Cancel</button>
            <button id="confirm-delete-button" type="button">Delete</button>
        </div>
    </div>

    <!-- undo notif -->
    <div id="undo-notif">
        <span>Task deleted. Want to undo?</span>
        <button id="undo-button" type="button">Undo</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
