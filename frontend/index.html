<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listahan Mo, Dai!</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>USAD</h1>
        <p>One step at a time.</p>
        <p>Matatapos din yan. Uusad ka rin</p>
        <!-- TODO: Add navigation / user info later -->
    </header>

    <main>

        <section id="task-section">
            
            <div id="task-header">
                <h2>My Tasks</h2>
                <button id="add-task-button" type="button">+ Add Task</button>
            </div>

            <!-- FILTERS -->
            <div id="task-filters">
                <p>Filter by:</p>

                <div class="filter-group">
                    <!-- status -->
                    <span class="filter-label">Status</span>

                    <div id="status-tabs">
                        <button class="filter-tab active" data-status="all">ALL</button>
                        <button class="filter-tab" data-status="active">Active</button>
                        <button class="filter-tab" data-status="done">Completed</button>
                    </div>
                </div>
                
                <div class="filter-group">
                    <!-- category / tabs -->
                    <span class="filter-label">Category</span>

                    <div id="category-tabs">
                        <button class="category-tab active" data-category="all">ALL</button>
                        <button class="category-tab" data-category="School">School</button>
                        <button class="category-tab" data-category="Personal">Personal</button>
                        <button class="category-tab" data-category="Others">Others</button>
                    </div>
                </div>
               
                <div class="filter-group">
                    <!-- priority -->
                    <span class="filter-label">Priority</span>

                    <div id="priority-tabs">
                        <button class="priority-tab active" data-priority="all">ALL</button>
                        <button class="priority-tab" data-priority="Low">Low</button>
                        <button class="priority-tab" data-priority="Medium">Medium</button>
                        <button class="priority-tab" data-priority="High">High</button>
                    </div>
                </div>
    
            </div>

            <!-- SORTING -->
            <div id="task-sort">
                <label for="sort-select">Sort By:</label>
                <select id="sort-select">
                    <option value="created_at">Date Added</option>
                    <option value="due">Due Date</option>
                    <option value="priority">Priority</option>
                    <option value="tag">Tag</option>
                </select>
            </div>


            <div id="task-list">
                <!-- JS will generate the tasks here -->
            </div>

        </section>
        
        <aside id="add-task-panel">
            <h2 id="task-panel-title">Add a Task</h2>

            <button id="close-task-panel" type="button">X</button>
            
            <form id="task-form">
                <!-- form fields -->
                <div>
                    <label for="title">Task</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Ano ubrahon mo gha?"
                        required
                    >   
                </div>

                <div>
                    <label for="due">Due date and time</label>
                    <input
                        type="datetime-local"
                        id="due"
                        name="due"
                    >   
                </div>

                <div>
                    <label for="prio">Priority</label>
                    <select id="prio" name="prio">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select> 
                </div>

                <div>
                    <label for="tag">Category</label>
                    <select id="tag" name="tag">
                        <option value="School">School</option>
                        <option value="Personal">Personal</option>
                        <option value="Others">Others</option>
                    </select> 
                </div>

                <button id="task-submit-button" type="submit">Add Task</button>
            </form>
        </aside>
    </main>

    <!-- undo notif -->
    <div id="undo-notif">
        <span>Task deleted. Want to undo?</span>
        <button id="undo-button" type="button">Undo</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
