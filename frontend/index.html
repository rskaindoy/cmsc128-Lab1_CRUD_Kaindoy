<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listahan Mo, Dai!</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Listahan Mo, Dai!</h1>
        <!-- TODO: Add navigation / user info later -->
    </header>

    <main>

        <section id="task-section">
            <h2>LISTA</h2>

            <!-- TODO: Add filters/sorting later -->

            <div id="task-list">
                <!-- JS will generate the tasks here -->
            </div>

        </section>

        <!-- ADD TASK -->
        <button id="add-task-button">Add Task</button>
        
        <aside id="add-task-panel">
            <h2>Add a Task</h2>

            <button id="close-task-panel" type="button">X</button>
            
            <form id="task-form">
                <!-- form fields -->
                <div>
                    <label for="title">Task</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Ano ubrahon mo gha?"
                        required
                    >   
                </div>

                <div>
                    <label for="due">Due date and time</label>
                    <input
                        type="datetime-local"
                        id="due"
                        name="due"
                    >   
                </div>

                <div>
                    <label for="prio">Priority</label>
                    <select id="prio" name="prio">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select> 
                </div>

                <div>
                    <label for="tag">Category</label>
                    <select id="tag" name="tag">
                        <option value="School">School</option>
                        <option value="Personal">Personal</option>
                        <option value="Others">Others</option>
                    </select> 
                </div>

                <button type="submit">Add Task</button>
            </form>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
